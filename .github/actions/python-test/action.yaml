name: test python app
description: this will test python app

inputs:
  WORKING_DIR:
    description: working dir of micro service
    required: true
  PYTHON_VERSION:
    description: version of python to be used
    default: "3.13"
    required: false

runs:
  using: composite

  steps:
    - id: install-python
      name: install python
      uses: actions/setup-python@v5
      with:
        python-version: ${{inputs.PYTHON_VERSION}}

    - id: run-tests
      name: run the tests
      shell: bash
      working-directory: ${{inputs.WORKING_DIR}}
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pytest -q
