name: reuse-node-ms-ci-cd
on:
  workflow_call:
    inputs:
      DOCKER_IMAGE_NAME:
        type: string
        required: true
      WORKING_DIR:
        type: string
        required: true     

jobs:
  node-test-app:
    runs-on: ubuntu-latest
    name: node test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - id: node-test
        name: node test
        uses: ./.github/actions/node-test
        with:
          WORKING_DIR: ${{inputs.WORKING_DIR}}

  docker-build-package-push-job:
    name: docker build, package and push
    runs-on: ubuntu-latest
    needs: node-test-app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: docker push image
        uses: ./.github/actions/docker-build-push
        with:
          IMAGE_NAME: ${{inputs}}
          WORKING_DIR: ${{inputs.WORKING_DIR}}
          DOCKERHUB_USERNAME: ${{vars.DOCKERHUB_USERNAME}}
          DOCKERHUB_TOKEN: ${{secrets.DOCKERHUB_TOKEN}}
          ADDITIONAL_ARGS: --build-arg NEXT_PUBLIC_API_BASE_URL=${{vars.NEXT_PUBLIC_API_BASE_URL}}
