name: auth-ms-ci-cd
on:
  workflow_dispatch:
env:
  DOCKER_IMAGE_NAME: "mdbasheer333/i27-auth-ms"
  WORKING_DIR: i27-helpdesk-auth-service

jobs:
  maven-test-app:
    runs-on: ubuntu-latest
    name: java maven test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - id: java-maven-test
        name: java maven test
        uses: ./.github/actions/java-maven-test
        with:
          WORKING_DIR: ${{env.WORKING_DIR}}

  docker-build-package-push-job:
    name: docker build and push
    runs-on: ubuntu-latest
    needs: maven-test-app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: docker push image
        id: docker-push-image
        uses: ./.github/actions/docker-build-push
        with:
          IMAGE_NAME: ${{env.DOCKER_IMAGE_NAME}}
          WORKING_DIR: ${{env.WORKING_DIR}}
          DOCKERHUB_USERNAME: ${{vars.DOCKERHUB_USERNAME}}
          DOCKERHUB_TOKEN: ${{secrets.DOCKERHUB_TOKEN}}
