name: ticket-ms-ci-cd
on:
    workflow_dispatch: 

env:
  DOCKER_IMAGE_NAME: 'mdbasheer333/i27-ticket-ms'

jobs:
  test-app:
    runs-on: ubuntu-latest
    name: app testing
    steps:
      - id: step1
        name: check out code
        uses: actions/checkout@v7
      
      - id: step2
        name: install java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'        
      
      - id: step3
        name: run the test
        working-directory: i27-helpdesk-ticket-service
        run: |
          mvn clean test
      
      - id: step4
        name: upload the results
        uses: actions/upload-artifact@v7
        with:
          name: ticket-service-test-result
          path: ./i27-helpdesk-ticket-service/target/surefire-reports
          retention-days: 2

  docker-build-package-push-job: 
    name: docker build, package and push
    runs-on: ubuntu-latest
    needs: test-app
    
    steps:  
      - name: checkout repo
        uses: actions/checkout@v7
        
      - name: docker login
        uses: docker/login-action@v4
        with:
          username: ${{vars.DOCKERHUB_USERNAME}}
          password: ${{secrets.DOCKERHUB_TOKEN}}
      
      - name: docker build image
        working-directory: i27-helpdesk-ticket-service          
        run: docker build -t ${{env.DOCKER_IMAGE_NAME}}:${{github.sha}} .

      - name: docker info
        run: docker images
        
      - name: docker push
        run: docker push ${{env.DOCKER_IMAGE_NAME}}:${{github.sha}}
