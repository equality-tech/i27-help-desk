name: comment-ms-ci-cd
on:
  workflow_dispatch:

env:
  DOCKER_IMAGE_NAME: "mdbasheer333/i27-comment-ms"
  WORKING_DIR: i27-helpdesk-comment-service

jobs:
  python-test-app:
    runs-on: ubuntu-latest
    name: python app testing
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - id: python-test-app
        name: check out code
        uses: ./.github/actions/python-test
        with:
          WORKING_DIR: $WORKING_DIR

  docker-build-package-push-job:
    name: docker build, package and push
    runs-on: ubuntu-latest
    needs: python-test-app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: docker push image
        uses: ./.github/actions/docker-build-push
        with:
          IMAGE_NAME: ${{env.DOCKER_IMAGE_NAME}}
          WORKING_DIR: ${{env.WORKING_DIR}}
          DOCKERHUB_USERNAME: ${{vars.DOCKERHUB_USERNAME}}
          DOCKERHUB_TOKEN: ${{secrets.DOCKERHUB_TOKEN}}
